name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build backend
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/team-backend-1.0.0.jar

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.ECS_HOST }}" ]; then echo "❌ ERROR: secrets.ECS_HOST is empty!"; exit 1; fi
          if [ -z "${{ secrets.ECS_USER }}" ]; then echo "❌ ERROR: secrets.ECS_USER is empty!"; exit 1; fi
          if [ -z "${{ secrets.ECS_PASS }}" ]; then echo "❌ ERROR: secrets.ECS_PASS is empty!"; exit 1; fi
          echo "✅ All secrets are set"

      - name: Deploy to ECS
        if: github.ref == 'refs/heads/main'
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PASS: ${{ secrets.ECS_PASS }}
        run: |
          sudo apt-get install -y sshpass
          echo "Deploying to $ECS_USER@$ECS_HOST ..."
          sshpass -p "$ECS_PASS" scp -o StrictHostKeyChecking=no \
            backend/target/team-backend-1.0.0.jar \
            "$ECS_USER@$ECS_HOST:/opt/football-team/football-team.jar"
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no "$ECS_USER@$ECS_HOST" \
            "systemctl restart football-team && sleep 2 && systemctl is-active football-team"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build WeApp
        working-directory: ./frontend
        run: npm run build:weapp

      - name: Verify dist exists
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "❌ frontend/dist/ not found after build!"
            exit 1
          fi
          echo "✅ frontend/dist/ found"
          ls -la frontend/dist/ | head -15

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
