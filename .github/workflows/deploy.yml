name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build backend
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/team-backend-1.0.0.jar

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.ECS_HOST }}" ]; then echo "❌ ERROR: secrets.ECS_HOST is empty!"; exit 1; fi
          if [ -z "${{ secrets.ECS_USER }}" ]; then echo "❌ ERROR: secrets.ECS_USER is empty!"; exit 1; fi
          if [ -z "${{ secrets.ECS_SSH_KEY }}" ]; then echo "❌ ERROR: secrets.ECS_SSH_KEY is empty!"; exit 1; fi
          echo "✅ All secrets are set"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}
          log-public-key: false

      - name: Deploy to ECS
        if: github.ref == 'refs/heads/main'
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        shell: bash
        run: |
          set +e  # shell: bash 仍会启用 -e，显式关闭，防止健康检查非零码掐断脚本
          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=10 $ECS_USER@$ECS_HOST"

          # 1. 上传 JAR
          ls -la backend/target/team-backend-1.0.0.jar || { echo "❌ JAR 文件不存在"; exit 1; }
          cat backend/target/team-backend-1.0.0.jar | $SSH "cat > /opt/football-team/football-team.jar.tmp && mv /opt/football-team/football-team.jar.tmp /opt/football-team/football-team.jar" \
            || { echo "❌ JAR 上传失败"; exit 1; }
          echo "✅ JAR 上传成功"

          # 2. 重启服务
          $SSH "systemctl restart football-team"
          echo "✅ 服务重启中..."

          # 3. 健康检查（最多等 60s）
          for i in $(seq 1 30); do
            CODE=$($SSH "curl -s --max-time 10 --connect-timeout 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/activities/team/1")
            if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then
              echo "✅ 服务健康 (HTTP $CODE)"
              break
            fi
            echo "等待服务就绪... ($i/30)"
            sleep 2
            if [ "$i" = "30" ]; then
              echo "❌ 健康检查超时"
              exit 1
            fi
          done
          echo "✅ 部署完成"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build WeApp
        working-directory: ./frontend
        run: npm run build:weapp

      - name: Verify dist exists
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "❌ frontend/dist/ not found after build!"
            exit 1
          fi
          echo "✅ frontend/dist/ found"
          ls -la frontend/dist/ | head -15

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
