<h2>手动调整分组时，如何移动队员？</h2>
<p class="subtitle">选择最符合你使用习惯的操作方式</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>点击队员 → 选择目标组</h3>
      <p>点击队员卡片后，页面出现"移到第1组 / 第2组"等按钮，点击即移动。简单直接，无需拖拽。</p>
      <div style="margin-top:12px; background:#f5f5f5; border-radius:8px; padding:12px; font-size:13px">
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px">
          <span style="background:#4CAF50;color:#fff;padding:4px 10px;border-radius:16px">张三 ✓</span>
          <span style="color:#666">← 点击后高亮</span>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap">
          <button style="border:1px solid #4CAF50;color:#4CAF50;background:#fff;padding:4px 12px;border-radius:4px">移到第1组</button>
          <button style="border:1px solid #4CAF50;color:#4CAF50;background:#fff;padding:4px 12px;border-radius:4px">移到第2组</button>
          <button style="border:1px solid #999;color:#999;background:#fff;padding:4px 12px;border-radius:4px">取消</button>
        </div>
      </div>
    </div>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>长按拖拽到目标组</h3>
      <p>长按队员卡片可拖拽到另一个分组区域，松手即完成移动。操作更直观但技术复杂度高，小程序拖拽体验参差不齐。</p>
      <div style="margin-top:12px; background:#f5f5f5; border-radius:8px; padding:12px; font-size:13px; color:#666">
        <div style="border:2px dashed #4CAF50;border-radius:8px;padding:8px;text-align:center">
          第2组（拖拽到此处）
        </div>
        <div style="text-align:center;margin-top:6px">⬆ 长按「张三」拖到这里</div>
      </div>
    </div>
  </div>
</div>
