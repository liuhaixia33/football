spring:
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev_local_secret_key_for_testing}
  expire-hours: 720

wechat:
  app-id: ${WECHAT_APP_ID:dev_mock}
  app-secret: ${WECHAT_APP_SECRET:dev_mock}
  # 正式版: release  体验版: trial  开发版: develop
  env-version: ${WECHAT_ENV_VERSION:trial}

oss:
  endpoint: ${OSS_ENDPOINT}
  access-key-id: ${OSS_KEY_ID}
  access-key-secret: ${OSS_KEY_SECRET}
  bucket-name: ${OSS_BUCKET}
  base-url: ${OSS_BASE_URL}
